[time_settings]
; 12 часов реального времени = 1 игровой год
seconds_per_year = 43200.0

; Полная длина суток (ДЕНЬ + НОЧЬ) в реальных секундах — всегда сумма = это число
day_night_cycle_seconds = 900.0

; Старт: игровой час 0…24
start_hour = 8.0

[day_night_hours]
; ночь = [dusk_end … 24) + [0 … dawn_start)
dawn_start = 5.0
dawn_end = 8.0
day_end = 18.0
dusk_end = 21.0

[day_night_spin]
; ночь в N раз быстрее дня; сутки всё равно = day_night_cycle_seconds
night_time_mult = 2.0
