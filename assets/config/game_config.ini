[time_settings]
; 12 часов wall = 1 игровой год
seconds_per_year = 43200.0	;86400

; Полный цикл суток (dawn+day+dusk+night), wall-секунды @ time_scale 1
day_night_cycle_seconds = 900.0

[day_night_phases]
; Доли от 1.0 (сумма = 1). Секунды = доля * day_night_cycle_seconds
dawn = 0.1
day = 0.7
dusk = 0.1
night = 0.1
