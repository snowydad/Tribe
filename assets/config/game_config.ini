[time_settings]
; Базовое реальное время: 1 день (86400 секунд) = 1 год жизни персонажа
seconds_per_year = 86400.0

; Длительность полного визуального цикла смены дня и ночи в реальных секундах (например, 15 минут)
day_night_cycle_seconds = 900.0


[age_ranges]
; Возраст при создании нового персонажа
min_starting_age = 18
max_starting_age = 35

[base_stats]
; Базовые характеристики персонажей по умолчанию
max_health = 100.0
move_speed = 4.0
work_speed = 1.0
hunger_rate = 0.5

[future_stat_defaults]
; Заготовки под будущие навыки и наклонности
strength = 10
intelligence = 10
endurance = 10
crafting_skill = 0
gathering_skill = 0
building_skill = 0
