[work]
skill = "worker"
work_type = "fueling"
work_anim = "deposit"
base_work_time = 1.0

[fuel]
; 1 wood → +fuel_seconds_per_wood секунд горения
fuel_seconds_per_wood = 60.0
; максимум «поленьев» в запасе (время = wood * 10)
max_wood = 10
; старт
start_wood = 2

[build]
; total work-seconds (ticks while character builds)
build_time = 30.0
; how many wood units to finish (each wood → +build_time/N progress)
build_wood_needed = 5
; placement: min ground Y (water ~0 → higher = only drier land)
place_min_y = 0.25
; min distance to other objects / characters (m)
place_clear_radius = 2.5
