; =============================================================================
; УНИВЕРСАЛЬНАЯ ЗАГОТОВКА ini для рабочего объекта (куст, склад, дом, …)
; Скопируй файл → assets/config/<object>.ini и заполни.
; ОБНОВЛЕНО: 2026-10-08
;
; Идея:
;   - объект = список работ [work_<id>] в ОДНОМ формате
;   - перс берёт задачу (id) → skill / work_type / work_anim / time
;   - work_anim нет в модели → fallback анимация "work" (в character.ini / коде)
;   - deliver / eat / harvest / build — не особые миры, а work_* на объекте
; =============================================================================


; -----------------------------------------------------------------------------
; РАБОТЫ — копируй блок [work_<id>] сколько нужно
; id = gather | deposit | withdraw | build | upgrade | demolish | clear | …
; -----------------------------------------------------------------------------

; --- example: a single work (like a berry bush) ---
[work_gather]
skill = "forager"; skill - what grants XP, linked to a talent
work_type = "foraging"; work_type — a family of actions: foraging, delivering, withdraw, building, … for AI, UI groups, and general factors
work_anim = "gather_berries"; work_anim - char clip; if no clip is available, use the “work” fallback
base_work_time = 3.0; base_work_time — seconds of the base cycle (before work_speed / energy)


; --- storage-- deposit ---
[work_deposit]
skill = "trader"
work_type = "delivering"
work_anim = "deposit"
base_work_time = 1.0

; --- storage --- deposit something(food,wood) ---
[work_withdraw]
skill = "trader"
work_type = "withdraw"
work_anim = "withdraw"
base_work_time = 1.0

; --- пример: апгрейд объекта (склад, дом, …) ---
[work_upgrade]
skill = "builder"
work_type = "building"
work_anim = "build"
base_work_time = 8.0

; --- пример: снос ---
[work_demolish]
skill = "worker"
work_type = "building"
work_anim = "demolish"
base_work_time = 4.0

; --- пример: расчистка / срубить ---
[work_clear]
skill = "worker"
work_type = "clearing"
work_anim = "clear"
base_work_time = 3.0


; -----------------------------------------------------------------------------
; ВЫХОД РЕСУРСА (добыча) — только если объект ЧТО-ТО даёт в руки
; у склада обычно НЕТ — не копируй пустым
; -----------------------------------------------------------------------------
[output]
resource_type = "berry"
; id предмета (items.ini)
yield_amount = 1
; сколько за 1 успешный цикл work
max_amount = 5
; запас на объекте (ягоды на кусте и т.п.)
ripening_time = 60.0
; сек до восстановления / созревания (если нужно)
life_cycles_max = 10
; сколько полных циклов «обнулили запас»; 0 = бесконечно


; -----------------------------------------------------------------------------
; ПИТАНИЕ — если ресурс еда и сытость задаётся здесь
; (часто лучше в items.ini; здесь — legacy / удобство для ягод)
; -----------------------------------------------------------------------------
[nutrition]
nutrition_value = 25.0
; единиц сытости с 1 порции


; -----------------------------------------------------------------------------
; ВМЕСТИМОСТЬ ХРАНИЛИЩА — склад, сундук, …
; -----------------------------------------------------------------------------
[capacity]
max_storage = 50
; 0 = без лимита (если так решите в коде)


; -----------------------------------------------------------------------------
; НАВИГАЦИЯ / ТОЧКИ (опционально в ini, чаще в сцене)
; WP = Marker3D в ноде WorkPoints; obstacle — в сцене
; -----------------------------------------------------------------------------
; [navigation]
; docking_distance = 1.8
; arrival_distance = 0.2


; -----------------------------------------------------------------------------
; ЧТО НЕ КЛАСТЬ В work_*
; - mesh, obstacle, Marker3D → сцена (.tscn)
; - default_anim = "work" → один раз глобально, не на каждый объект
; - пустые [output]/[nutrition] — просто не создавать секции
; -----------------------------------------------------------------------------


; =============================================================================
; МИНИ-ПРИМЕРЫ ГОТОВЫХ НАБОРОВ (раскомментируй нужное при копировании)
; =============================================================================

